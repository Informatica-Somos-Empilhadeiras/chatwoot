<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OS do cliente</title>
  <script src="https://cdn.tailwindcss.com/3.4.13"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div class="max-w-xl mx-auto p-3">
    <header class="flex items-center justify-between gap-2 mb-3">
      <div>
        <h1 class="text-sm font-semibold text-slate-900">Ordens de Servico</h1>
        <p id="sub" class="text-xs text-slate-500">Carregando contexto do contato...</p>
      </div>
      <button id="reload" class="text-xs px-2 py-1 rounded-md border border-slate-300 hover:bg-slate-100">Atualizar</button>
    </header>

    <div class="flex gap-2 mb-3">
      <input id="search" type="text" placeholder="Buscar por no da OS ou nome do cliente"
             class="flex-1 text-xs px-2 py-1.5 rounded-md border border-slate-300 focus:outline-none focus:ring-1 focus:ring-slate-400" />
      <button id="searchBtn" class="text-xs px-3 py-1.5 rounded-md bg-slate-800 text-white hover:bg-slate-700">Ir</button>
    </div>

    <div id="status" class="text-xs text-slate-500 mb-2"></div>
    <div id="list" class="space-y-2"></div>
  </div>

  <script>
    const COR_BADGE = {
      Vermelho: 'bg-red-100 text-red-700 border-red-200',
      Amarelo: 'bg-amber-100 text-amber-700 border-amber-200',
      Verde: 'bg-emerald-100 text-emerald-700 border-emerald-200',
      Azul: 'bg-blue-100 text-blue-700 border-blue-200',
    };

    let contato = { codigoCliente: null, nome: null };

    function fmtData(s) {
      if (!s) return '-';
      const d = new Date(s);
      if (isNaN(d)) return s;
      return d.toLocaleDateString('pt-BR');
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function cardOS(o) {
      const badge = COR_BADGE[o.cor] || 'bg-slate-100 text-slate-600 border-slate-200';
      const atraso = o.diasAtraso > 0 ? `<span class="text-red-600 font-medium">${o.diasAtraso}d atraso</span>` : '';
      return `
        <div class="rounded-lg border border-slate-200 bg-white p-3 shadow-sm">
          <div class="flex items-center justify-between mb-1">
            <div class="font-semibold text-sm text-slate-900">OS ${esc(o.codigo)}</div>
            <span class="text-[11px] px-2 py-0.5 rounded-full border ${badge}">${esc(o.situacao)}${o.subStatus ? ' - ' + esc(o.subStatus) : ''}</span>
          </div>
          <div class="text-xs text-slate-600 space-y-0.5">
            <div><span class="text-slate-400">Cliente:</span> ${esc(o.cliente)} ${o.cidade ? '- ' + esc(o.cidade) + '/' + esc(o.uf) : ''}</div>
            <div><span class="text-slate-400">Maquina:</span> ${esc(o.maquina || o.familiaMaquina || '-')} ${o.nSerie ? '(' + esc(o.nSerie) + ')' : ''}</div>
            <div><span class="text-slate-400">Atendimento:</span> ${esc(o.tipoAtendimento || '-')} - ${esc(o.tipoOS || '')}</div>
            <div class="flex gap-3">
              <span><span class="text-slate-400">Entrada:</span> ${fmtData(o.dataEntrada)}</span>
              <span><span class="text-slate-400">Previsao:</span> ${fmtData(o.dataPrevisao)}</span>
              ${atraso}
            </div>
            <div><span class="text-slate-400">Tecnico:</span> ${esc(o.tecnico || '-')} &nbsp; <span class="text-slate-400">Vendedor:</span> ${esc(o.vendedor || '-')}</div>
            ${o.observacoes ? `<div class="text-slate-500 pt-1 border-t border-slate-100 mt-1">${esc(o.observacoes)}</div>` : ''}
          </div>
          <div class="flex gap-1 pt-2 mt-2 border-t border-slate-100">
            <a href="/relatorio.html?os=${encodeURIComponent(o.codigo)}&empresa=${encodeURIComponent(o.empresa || '')}" target="_blank" rel="noopener"
               class="text-[11px] px-2 py-1 rounded border border-slate-300 hover:bg-slate-100">Relatório</a>
            <input class="ss-in flex-1 text-[11px] px-1.5 py-1 border border-slate-300 rounded" value="${esc(o.subStatus || '')}" data-cod="${esc(o.codigo)}" data-emp="${esc(o.empresa || '')}" data-old="${esc(o.subStatus || '')}" />
            <button type="button" class="ss-save text-[11px] px-2 py-1 rounded bg-slate-800 text-white hover:bg-slate-700">Salvar substatus</button>
          </div>
        </div>`;
    }

    async function carregar(params) {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('list');
      statusEl.textContent = 'Consultando ERP...';
      listEl.innerHTML = '';
      try {
        const qs = new URLSearchParams(params).toString();
        const res = await fetch(`/api/os?${qs}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.error || 'erro');
        if (!data.os.length) {
          statusEl.innerHTML = 'Nenhuma OS encontrada para este contato. '
            + 'Dica: vincule o <b>CodigoCliente</b> do ERP ao contato (atributo <code>erp_codigo_cliente</code>) ou use a busca acima.';
          return;
        }
        statusEl.textContent = `${data.os.length} OS${data.mock ? ' (dados de exemplo)' : ''}`;
        listEl.innerHTML = data.os.map(cardOS).join('');
      } catch (e) {
        statusEl.innerHTML = `<span class="text-red-600">Falha: ${esc(e.message)}</span>`;
      }
    }

    function recarregarPorContato() {
      const sub = document.getElementById('sub');
      if (contato.codigoCliente) {
        sub.textContent = `Cliente ERP #${contato.codigoCliente}${contato.nome ? ' - ' + contato.nome : ''}`;
        carregar({ codigoCliente: contato.codigoCliente });
      } else if (contato.nome) {
        sub.textContent = `Buscando por nome: ${contato.nome}`;
        carregar({ nome: contato.nome });
      } else {
        sub.textContent = 'Sem identificador do cliente - use a busca manual.';
        document.getElementById('status').textContent = '';
      }
    }

    // ---- Handshake do Chatwoot Dashboard App ----
    window.addEventListener('message', (e) => {
      try {
        const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        if (!data || data.event !== 'appContext') return;
        const ctx = data.data || {};
        const c = ctx.contact || (ctx.conversation && ctx.conversation.meta && ctx.conversation.meta.sender) || {};
        const ca = c.custom_attributes || c.additional_attributes || {};
        contato.codigoCliente = ca.erp_codigo_cliente || ca.codigo_cliente || null;
        contato.nome = c.name || null;
        recarregarPorContato();
      } catch (_) { /* mensagem nao relacionada */ }
    });
    // Pede o contexto ao Chatwoot
    try { window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*'); } catch (_) {}

    // Busca manual
    document.getElementById('searchBtn').addEventListener('click', () => {
      const v = document.getElementById('search').value.trim();
      if (!v) return;
      if (/^\d+$/.test(v)) carregar({ os: v });
      else carregar({ nome: v });
    });
    document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('searchBtn').click(); });
    document.getElementById('reload').addEventListener('click', recarregarPorContato);

    // Salvar substatus de uma OS (escrita gated no backend por WRITE_ENABLED)
    document.getElementById('list').addEventListener('click', async (e) => {
      if (!e.target.classList.contains('ss-save')) return;
      const inp = e.target.previousElementSibling;
      const cod = inp.dataset.cod, emp = inp.dataset.emp, old = inp.dataset.old, novo = inp.value.trim();
      if (!novo) return;
      const btn = e.target; btn.disabled = true; const txt = btn.textContent; btn.textContent = 'Salvando...';
      try {
        const res = await fetch(`/api/os/${encodeURIComponent(cod)}/substatus`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subStatusNovo: novo, subStatusAntigo: old, empresa: emp }),
        });
        const d = await res.json().catch(() => ({}));
        btn.textContent = res.ok ? (d.mock ? 'OK (mock)' : 'Salvo') : (d.error || 'Falhou');
        if (res.ok) inp.dataset.old = novo;
      } catch (_) { btn.textContent = 'Erro'; }
      setTimeout(() => { btn.disabled = false; btn.textContent = txt; }, 2500);
    });

    // Fallback para abrir fora do Chatwoot (dev): sem contexto, espera busca manual.
    document.getElementById('sub').textContent = 'Aguardando contexto do Chatwoot...';
    setTimeout(() => {
      if (!contato.codigoCliente && !contato.nome) {
        document.getElementById('sub').textContent = 'Abra dentro do Chatwoot, ou use a busca manual acima.';
      }
    }, 1500);
  </script>
</body>
</html>
