en:
  outsider_crm:
    switch:
      enabled: "On"
      disabled: "Off"
      hint: "Shows the CRM in this account. When on, every agent has access; the account administrator can turn it off per agent in CRM > Settings > Access. Not the same as the “CRM” item in the account features list: that one shows the Contacts menu and must stay checked."
    errors:
      duplicate_open_opportunity: This contact already has an open opportunity in this business unit
      group_contact: WhatsApp groups cannot have opportunities
      stage_in_use: Move the opportunities out of this stage before removing it
      forwarded_locked: A forwarded opportunity can no longer change. Use the opportunity in the destination unit
    automations:
      stalled_task_title: "Follow up stalled deal in %{stage}"
      stalled_task_description: "Created by automation: the deal has been in the same stage for %{days} days."
    chain:
      rule_name: Sequential handoff
    claim:
      taken: Someone else took this deal before you
    proposals:
      locked: An accepted, rejected or canceled proposal can no longer change. Move it back to draft to edit
      invalid_image: Upload a PNG or JPG image
      send:
        defaults:
          send_message: "Hi {contato}! Here is proposal {numero} ({titulo}). Let me know if you have any questions."
          email_subject: "Proposal {numero} - {empresa}"
        errors:
          not_allowed: You cannot send this proposal
          channel: Choose WhatsApp or e-mail
          contact: Choose a contact from this account (groups cannot receive proposals)
          no_phone: This contact has no phone number
          no_email: This contact has no e-mail
          inbox: Choose an inbox you are a member of
          subject_required: Write the e-mail subject
          too_long: The text is too long
    proposal_templates:
      in_use:
        one: This template is used by 1 proposal. Deactivate it instead of deleting
        other: This template is used by %{count} proposals. Deactivate it instead of deleting
      last_active: Each proposal type needs at least one active template
      too_many_images: This template already has too many images. Delete image elements you no longer use
    forward:
      task_title: "Contact the customer forwarded by %{unit}"
      errors:
        not_open: Only open opportunities can be forwarded
        already_forwarded: This opportunity was already sent to another unit
        invalid_unit: Choose an active destination unit other than the current one
        limit_reached: "This lead was already forwarded %{max} times, the account limit. Mark the opportunity as won or lost"
        duplicate_open: The contact already has an open opportunity in the destination unit
        no_pipeline: The destination unit has no active pipeline
        invalid_reason: Choose a forwarding reason from the list
        reason_required: Choose the forwarding reason
        notes_too_long: The note is longer than 2000 characters
        invalid_owner: The owner must be a member of the destination unit
        no_conversation: This opportunity has no linked conversation to assign
        no_owner_to_assign: Choose the destination owner to assign the conversation
        owner_not_in_inbox: "%{name} is not in this conversation's inbox"
        conversation_forbidden: You are not in this conversation's inbox, so you cannot assign it
  # Campo "CRM" da conta no Super Admin (Outsider::Crm::AccountDashboardSwitch)
  activerecord:
    errors:
      models:
        outsider/crm/proposal_template:
          invalid_image: "Upload a PNG or JPG image"
          image_too_large: "The image is larger than 5 MB"
  helpers:
    label:
      account:
        outsider_crm_enabled: Sales CRM (Somos)
