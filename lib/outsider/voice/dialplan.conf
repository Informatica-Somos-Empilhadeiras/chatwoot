; OUTSIDER: plano de discagem da central (Entrega 22; desde a Entrega 26 vem do Chatwoot, em
; Outsider::Voice::CentralConfig#extensions, para chegar à central em até 30 s sem recriar o contêiner).
; Pergunta ao Chatwoot o caminho de cada ligação e avisa atendimento e fim (VOICE_URL e VOICE_TOKEN vêm do
; ambiente do contêiner). URA: o Chatwoot diz cada passo; *80 + ramal: o supervisor ouve em silêncio; *81 + ramal:
; sussurro (do supervisor ou de colega convidado); X-Outsider-Deal: o negócio de onde o vendedor ligou.
; Num contêiner antigo, que ainda traz o plano fixo, este arquivo é lido antes dele e vale no lugar dele.

; ligações que saem do telefone do navegador
[from-agents]
; teste de eco: devolve a própria voz (confere microfone, fone e rede)
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; supervisor ouve a ligação do ramal sem ninguém perceber: sem bipe, sem anúncio, só enquanto ela durar.
; O Chatwoot confere se ele pode (gestor da unidade ou administrador) e registra a monitoria
exten => _*80[1-5]XX,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(TARGET=${EXTEN:3})
 same => n,Set(OK=${CURL(${ENV(VOICE_URL)}/monitor,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&extension=${CHANNEL(endpoint)}&target=${TARGET}&mode=listen)})
 same => n,GotoIf($["${OK}" != "ok"]?refused)
 same => n,Set(CHANNEL(hangup_handler_push)=outsider-hangup,s,1)
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${TARGET}-,qbES)
 same => n,Hangup()
 same => n(refused),Congestion(3)
 same => n,Hangup()

; sussurro: o Chatwoot diz quem é e como entra ("supervisor:<id>:whisper" ou "guest:<id>:open|whisper", colega
; convidado pelo atendente) e o telefone do atendente atende sozinho; com whisper, só os atendentes ouvem quem
; sussurra (a mistura do áudio é feita no navegador dele); com open, o cliente também ouve
exten => _*81[1-5]XX,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(TARGET=${EXTEN:3})
 same => n,Set(WHO=${CURL(${ENV(VOICE_URL)}/monitor,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&extension=${CHANNEL(endpoint)}&target=${TARGET}&mode=whisper)})
 same => n,GotoIf($[${REGEX("^(supervisor|guest):[0-9]+:(whisper|open)$" ${WHO})} = 0]?refused)
 same => n,Set(CHANNEL(hangup_handler_push)=outsider-hangup,s,1)
 same => n,Dial(PJSIP/${TARGET},15,b(outsider-whisper^s^1(${WHO})))
 same => n,Hangup()
 same => n(refused),Congestion(3)
 same => n,Hangup()

; ramal para ramal
exten => _[1-5]XX,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CHANNEL(hangup_handler_push)=outsider-hangup,s,1)
 same => n,Set(R=${CURL(${ENV(VOICE_URL)}/internal,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&extension=${CHANNEL(endpoint)}&target=${EXTEN})})
 same => n,Dial(PJSIP/${EXTEN},30,U(outsider-answered^${CHANNEL(linkedid)}))
 same => n,Hangup()

; número de fora (8 dígitos ou mais, como 4004-1234): o Chatwoot diz com que número sair e como discar, ou recusa
exten => _XXXXXXX.,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(DEAL=${FILTER(0-9,${PJSIP_HEADER(read,X-Outsider-Deal)})})
 same => n,Set(PLAN=${CURL(${ENV(VOICE_URL)}/outbound,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&extension=${CHANNEL(endpoint)}&number=${EXTEN}&deal=${DEAL})})
 same => n,GotoIf($["${PLAN}" = ""]?refused)
 same => n,Set(CHANNEL(hangup_handler_push)=outsider-hangup,s,1)
 same => n,Set(CALLERID(num)=${CUT(PLAN,|,1)})
 same => n,Dial(PJSIP/${CUT(PLAN,|,2)}@operadora,90,U(outsider-answered^${CHANNEL(linkedid)}))
 same => n,Hangup()
 same => n(refused),Congestion(3)
 same => n,Hangup()

; ligações que chegam da operadora: toca em etapas (dono do negócio, estado, todos) ou, com URA, vai para ela
[from-trunk]
exten => _[+0-9a-zA-Z].,1,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(CHANNEL(hangup_handler_push)=outsider-hangup,s,1)
 same => n,Set(PLAN=${CURL(${ENV(VOICE_URL)}/inbound,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&did=${URIENCODE(${EXTEN})}&to=${URIENCODE(${PJSIP_HEADER(read,To)})}&from=${URIENCODE(${CALLERID(num)})})})
 same => n,GotoIf($["${PLAN}" = "ivr"]?outsider-ivr,s,1)
 same => n,ExecIf($["${PLAN}" = ""]?Set(PLAN=${RING_SECONDS}|${ALL_AGENTS}))
 same => n,Set(RING=${CUT(PLAN,|,1)})
 same => n,Set(STEP=2)
 same => n(next),Set(TARGETS=${CUT(PLAN,|,${STEP})})
 same => n,GotoIf($["${TARGETS}" = ""]?done)
 same => n,Dial(${TARGETS},${RING},b(outsider-callid^s^1(${CHANNEL(linkedid)}))U(outsider-answered^${CHANNEL(linkedid)}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Set(STEP=$[${STEP} + 1])
 same => n,Goto(next)
 same => n(done),Hangup()

; URA: a cada passo, o Chatwoot responde uma instrução (Outsider::Voice::IvrRunner):
;   play|sons|bloco   menu|sons|segundos|bloco   collect|sons|dígitos|segundos|bloco   hangup|sons
;   ring|sons|segundos|bloco|etapa1|etapa2...    forward|sons|segundos|bloco|bina|número    record|sons|segundos|bloco
; Sem resposta do Chatwoot, toca para todos os ramais, como sem URA.
[outsider-ivr]
exten => s,1,Answer()
 same => n,Set(NODE=)
 same => n,Set(INPUT=)
 same => n(step),Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=8)
 same => n,Set(STEP=${CURL(${ENV(VOICE_URL)}/ivr,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&node=${NODE}&input=${INPUT}&dialstatus=${DIALSTATUS})})
 same => n,Set(INPUT=)
 same => n,Set(DIALSTATUS=)
 same => n,Set(ACTION=${CUT(STEP,|,1)})
 same => n,Set(SOUNDS=${CUT(STEP,|,2)})
 same => n,GotoIf($["${ACTION}" = "play"]?play)
 same => n,GotoIf($["${ACTION}" = "menu"]?menu)
 same => n,GotoIf($["${ACTION}" = "collect"]?collect)
 same => n,GotoIf($["${ACTION}" = "ring"]?ring)
 same => n,GotoIf($["${ACTION}" = "forward"]?forward)
 same => n,GotoIf($["${ACTION}" = "record"]?record)
 same => n,GotoIf($["${ACTION}" = "hangup"]?bye)
 same => n,Set(STEP=ring||${RING_SECONDS}|_end|${ALL_AGENTS})
 same => n,Set(SOUNDS=)
 same => n,Goto(ring)
 same => n(play),ExecIf($["${SOUNDS}" != ""]?Playback(${SOUNDS}))
 same => n,Set(NODE=${CUT(STEP,|,3)})
 same => n,Goto(step)
 same => n(menu),Read(INPUT,${SOUNDS},1,,1,${CUT(STEP,|,3)})
 same => n,Set(NODE=${CUT(STEP,|,4)})
 same => n,Goto(step)
 same => n(collect),Read(INPUT,${SOUNDS},${CUT(STEP,|,3)},,1,${CUT(STEP,|,4)})
 same => n,Set(NODE=${CUT(STEP,|,5)})
 same => n,Goto(step)
 same => n(ring),ExecIf($["${SOUNDS}" != ""]?Playback(${SOUNDS}))
 same => n,Set(RING=${CUT(STEP,|,3)})
 same => n,Set(NODE=${CUT(STEP,|,4)})
 same => n,Set(I=5)
 same => n(ringnext),Set(TARGETS=${CUT(STEP,|,${I})})
 same => n,GotoIf($["${TARGETS}" = ""]?step)
 same => n,Dial(${TARGETS},${RING},b(outsider-callid^s^1(${CHANNEL(linkedid)}))U(outsider-answered^${CHANNEL(linkedid)}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Set(I=$[${I} + 1])
 same => n,Goto(ringnext)
 same => n(forward),ExecIf($["${SOUNDS}" != ""]?Playback(${SOUNDS}))
 same => n,Set(NODE=${CUT(STEP,|,4)})
 same => n,Dial(PJSIP/${CUT(STEP,|,6)}@operadora,${CUT(STEP,|,3)},f(${CUT(STEP,|,5)})U(outsider-answered^${CHANNEL(linkedid)}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done:step)
 same => n(record),ExecIf($["${SOUNDS}" != ""]?Playback(${SOUNDS}))
 same => n,Playback(outsider/beep)
 same => n,Record(/var/spool/asterisk/outsider-voicemail/${CHANNEL(linkedid)}.wav,4,${CUT(STEP,|,3)},kq)
 same => n,Set(NODE=${CUT(STEP,|,4)})
 same => n,Goto(step)
 same => n(bye),ExecIf($["${SOUNDS}" != ""]?Playback(${SOUNDS}))
 same => n(done),Hangup()

; sussurro: avisa o telefone do atendente quem está entrando (ele atende sozinho e mistura só para os atendentes)
[outsider-whisper]
exten => s,1,Set(PJSIP_HEADER(add,X-Outsider-Whisper)=${ARG1})
 same => n,Return()

; OUTSIDER (push): o id da ligação vai para o telefone de cada atendente; quem recusou não toca de novo na próxima
; etapa da mesma ligação (o telefone recusa sozinho)
[outsider-callid]
exten => s,1,Set(PJSIP_HEADER(add,X-Outsider-Call)=${ARG1})
 same => n,Return()

; avisos ao Chatwoot
[outsider-answered]
exten => s,1,Set(CURLOPT(httptimeout)=5)
 same => n,Set(R=${CURL(${ENV(VOICE_URL)}/answered,token=${ENV(VOICE_TOKEN)}&linkedid=${ARG1}&endpoint=${CHANNEL(endpoint)})})
 same => n,Return()

[outsider-hangup]
exten => s,1,Set(CURLOPT(httptimeout)=5)
 same => n,Set(R=${CURL(${ENV(VOICE_URL)}/hangup,token=${ENV(VOICE_TOKEN)}&linkedid=${CHANNEL(linkedid)}&dialstatus=${DIALSTATUS}&cause=${HANGUPCAUSE})})
 same => n,Return()
